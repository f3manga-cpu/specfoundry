name: Agent Surface Lab checks
on:
  push:
    branches: [surface-lab-launch-2026-11-03]
  pull_request:
    paths:
      - 'web/**'
      - 'tests/scanner.test.mjs'
      - 'tests/live-browser.mjs'
      - '.github/workflows/agent-surface-lab.yml'
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scanner rules
        run: node --test tests/scanner.test.mjs
  production-browser:
    needs: unit
    if: github.ref == 'refs/heads/surface-lab-launch-2026-11-03'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify public deployment in Chromium
        run: node tests/live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specfoundry-public-browser-evidence
          path: artifacts/
          if-no-files-found: ignore
